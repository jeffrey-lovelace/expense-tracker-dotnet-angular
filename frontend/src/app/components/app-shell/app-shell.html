<header class="bar">
  <div class="bar-inner">
    <span class="brand">Expense Tracker</span>
    <div class="user">
      <span class="name">{{ userName() }}</span>
      <button
        mat-icon-button
        type="button"
        aria-label="Sign out"
        matTooltip="Sign out"
        (click)="signOut.emit()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</header>

<main class="content">
  <ng-content />
</main>
